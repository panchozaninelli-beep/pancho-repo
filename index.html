<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Test 47</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;color:#ddd;font-family:Orbitron,monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{display:block;background:#000}
  #pad{display:none;gap:8px;padding:8px 0 14px}
  body.touch #pad{display:flex}
  .btn{width:60px;height:56px;border:1px solid #444;border-radius:12px;background:#111;color:#eee;font:700 18px Orbitron,monospace;display:flex;align-items:center;justify-content:center}
  .btn.on{background:#3a0d10;border-color:#ff3b4a;color:#fff}
  .btn.wide{width:84px;font-size:10px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="pad">
    <div class="btn" data-k="left">⟲</div>
    <div class="btn" data-k="down">▼</div>
    <div class="btn" data-k="up">▲</div>
    <div class="btn" data-k="right">⟳</div>
    <div class="btn wide" data-k="space">SUCCIÓN</div>
  </div>
</div>
<script>
// ---------- setup ----------
const W = 460, H = 1000, FLOOR = 700, G = 160;      // world units: px, px/s, 10 px = 1 m
const THRUST = 330, SPIN = 7, SUCTION = 1.7 * G;
const LEFT = -1500;                                   // the world extends left of the screen; the camera follows the car
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const isTouch = matchMedia('(pointer:coarse)').matches;
if (isTouch) document.body.classList.add('touch');

function resize() {
  const availH = innerHeight - (isTouch ? 80 : 0);
  const s = Math.min(innerWidth / W, availH / H);
  const dpr = devicePixelRatio || 1;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
addEventListener('resize', resize); resize();

// ---------- track: sampled every 1px along the riding surface ----------
// n = surface normal pointing toward the car, k = curvature
const P = [];
function addLine(x0, y0, x1, y1, nx, ny) {
  const L = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(L);
  for (let i = 0; i < n; i++) {
    const t = i / n;
    P.push({ x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t, tx: (x1 - x0) / L, ty: (y1 - y0) / L, nx, ny, k: 0 });
  }
}
function addArc(cx, cy, R, a0, a1) {
  const n = Math.ceil(Math.abs(a1 - a0) * R), d = Math.sign(a1 - a0);
  for (let i = 0; i < n; i++) {
    const a = a0 + (a1 - a0) * i / n;
    P.push({ x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), tx: -Math.sin(a) * d, ty: Math.cos(a) * d,
             nx: -Math.cos(a), ny: -Math.sin(a), k: 1 / R });
  }
}
addLine(40, FLOOR, 280, FLOOR, 0, -1);
addArc(280, 560, 140, Math.PI / 2, 0);
addLine(420, 560, 420, 340, -1, 0);
addArc(280, 340, 140, 0, -Math.PI / 2);
addLine(280, 200, 190, 200, 0, 1);
const TRACK_START = 120; // the ramp piece begins at x=160; before that the car rolls on the floor

function offsetPath(o) {
  const p = new Path2D();
  for (let i = TRACK_START; i < P.length; i++) {
    const q = P[i], x = q.x - q.nx * o, y = q.y - q.ny * o;
    i === TRACK_START ? p.moveTo(x, y) : p.lineTo(x, y);
  }
  return p;
}
const trackBand = offsetPath(14), trackSkirt = offsetPath(34),
      edgeIn = offsetPath(1.5), edgeOut = offsetPath(26.5), centerLine = offsetPath(14);

const stars = Array.from({ length: 300 }, () => ({ x: LEFT - 200 + Math.random() * (W - LEFT + 200), y: 150 + Math.random() * 700, a: Math.random() * 0.5 + 0.1 }));
let camX = 0;

// ---------- levels ----------
// pad: landing zone centre (x) and width in px; wind: horizontal push in the air (px/s², + = toward the ramp)
const LEVELS = [
  { pad: -150, w: 220, gas: 100, wind: 0 },
  { pad: -380, w: 170, gas: 100, wind: 0 },
  { pad: -220, w: 130, gas: 80, wind: 0 },
  { pad: -560, w: 130, gas: 90, wind: 30 },
  { pad: -150, w: 110, gas: 75, wind: -35 },
  { pad: -900, w: 110, gas: 100, wind: 0 },
  { pad: -420, w: 90, gas: 65, wind: 45 },
];
const EXIT_X = 190;
const EASY_LEVELS = 3, SLOWMO = 0.3, SLOW_TIME = 5;   // levels 1-3 get one 5 s slow-motion assist per attempt
let level = 0, unlocked = 0;
const lvl = () => LEVELS[level];
const windStreaks = Array.from({ length: 28 }, () => ({ x: Math.random() * W, y: 160 + Math.random() * 520, len: 10 + Math.random() * 24 }));

// ---------- sound (Web Audio, synthesized) ----------
let AC = null, snd = null, muted = false;
function ensureAudio() {
  if (muted) return;
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination);
  const noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const hiss = (freq, q) => {
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = AC.createGain(); g.gain.value = 0;
    src.connect(f).connect(g).connect(master); src.start();
    return g;
  };
  const motor = AC.createOscillator(); motor.type = 'sawtooth';
  const mf = AC.createBiquadFilter(); mf.type = 'lowpass'; mf.frequency.value = 600;
  const mg = AC.createGain(); mg.gain.value = 0;
  motor.connect(mf).connect(mg).connect(master); motor.start();
  const hum = AC.createOscillator(); hum.frequency.value = 70;
  const hg = AC.createGain(); hg.gain.value = 0;
  hum.connect(hg).connect(master); hum.start();
  snd = { master, noiseBuf, main: hiss(900, 0.8), rcs: hiss(3800, 1.5), motor, mg, hg };
}
function setMuted(m) {
  muted = m; save();
  if (m) { if (AC) AC.suspend(); } else ensureAudio();
}
function updateAudio() {
  if (!snd || muted) return;
  const c = state, t = AC.currentTime, air = c.mode === 'air', hasGas = c.gas > 0, ramp = c.mode === 'ramp';
  const set = (param, v) => param.setTargetAtTime(v, t, 0.03);
  set(snd.main.gain, air && keys.up && c.armed && hasGas ? 0.35 : 0);
  set(snd.rcs.gain, air && (keys.left || keys.right) && hasGas ? 0.18 : 0);
  set(snd.mg.gain, ramp ? 0.05 + (keys.up ? 0.04 : 0) : 0);
  set(snd.motor.frequency, 45 + Math.abs(c.v) * 0.4);
  set(snd.hg.gain, ramp && c.suction && hasGas ? 0.05 : 0);
}
function sfx(kind) {
  if (!snd || muted) return;
  const t = AC.currentTime;
  const burst = (dur, freq, vol) => {
    const src = AC.createBufferSource(); src.buffer = snd.noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f).connect(g).connect(snd.master); src.start(t); src.stop(t + dur);
  };
  const tone = (f0, f1, dur, vol, type = 'sine', at = 0) => {
    const o = AC.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t + at); o.frequency.exponentialRampToValueAtTime(f1, t + at + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t + at);
    g.gain.exponentialRampToValueAtTime(vol, t + at + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + at + dur);
    o.connect(g).connect(snd.master); o.start(t + at); o.stop(t + at + dur + 0.05);
  };
  if (kind === 'land') { burst(0.25, 400, 0.5); tone(120, 45, 0.3, 0.5); }
  if (kind === 'crash') { burst(0.9, 2500, 0.9); burst(0.5, 300, 0.8); tone(90, 30, 0.6, 0.6, 'square'); }
  if (kind === 'win') { tone(660, 660, 0.18, 0.18, 'triangle', 0.15); tone(990, 990, 0.35, 0.18, 'triangle', 0.32); }
  if (kind === 'slip') tone(880, 440, 0.15, 0.12, 'square');
  if (kind === 'slow') tone(700, 180, 0.6, 0.2, 'triangle');
}

// ---------- input ----------
const keys = { up: false, down: false, left: false, right: false };
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left',
                 ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', e => {
  ensureAudio();
  if (e.code === 'KeyM') setMuted(!muted);
  const n = /^Digit([1-9])$/.exec(e.code);
  if (n && +n[1] - 1 <= unlocked && state.mode !== 'ramp' && state.mode !== 'air') { level = +n[1] - 1; save(); reset(false); }
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); onInput(); }
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) spaceAction(); }
  if (e.code === 'KeyR' || (e.code === 'Enter' && (state.mode === 'landed' || state.mode === 'crashed'))) reset(true);
});
addEventListener('keyup', e => {
  if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false;
  if (KEYMAP[e.code] === 'up') state.armed = true;   // main thruster needs a fresh press after leaving the ramp
});
const suctionBtn = document.querySelector('[data-k="space"]');
function toggleSuction() { state.suction = !state.suction; syncSuctionBtn(); }
const canSlow = () => state.mode === 'air' && level < EASY_LEVELS && !state.slowUsed;
// space: restart when the attempt is over, slow motion in the air (easy levels), suction toggle otherwise
function spaceAction() {
  const c = state;
  if (c.mode === 'landed' || c.mode === 'crashed') reset(true);
  else if (canSlow()) { c.slowUsed = true; c.slowLeft = SLOW_TIME; sfx('slow'); }
  else if (c.mode === 'ready' || c.mode === 'ramp') toggleSuction();
}
function syncSuctionBtn() {
  const c = state, over = c.mode === 'landed' || c.mode === 'crashed';
  const label = over ? 'REINICIAR' : c.mode === 'air' ? (canSlow() || c.slowLeft > 0 ? 'LENTO' : '—') : 'SUCCIÓN';
  if (suctionBtn.textContent !== label) suctionBtn.textContent = label;
  suctionBtn.classList.toggle('on', c.mode === 'air' ? c.slowLeft > 0 : !over && c.suction);
}
suctionBtn.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); spaceAction(); });
document.querySelectorAll('.btn:not([data-k="space"])').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); ensureAudio(); keys[k] = true; b.classList.add('on'); onInput(); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); if (k === 'up') state.armed = true; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
});
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (x > W - 110 && y < 44) { setMuted(!muted); return; }
  if (state.mode === 'landed' || state.mode === 'crashed') reset(true);
});

// ---------- state ----------
let testNo = 1, best = 0;
try {
  testNo = +localStorage.getItem('t47_test') || 1; best = +localStorage.getItem('t47_best') || 0;
  unlocked = Math.min(LEVELS.length - 1, +localStorage.getItem('t47_unlocked') || 0);
  level = Math.min(unlocked, +localStorage.getItem('t47_level') || 0);
  muted = localStorage.getItem('t47_mute') === '1';
} catch (e) {}
function save() {
  try {
    localStorage.setItem('t47_test', testNo); localStorage.setItem('t47_best', best);
    localStorage.setItem('t47_level', level); localStorage.setItem('t47_unlocked', unlocked);
    localStorage.setItem('t47_mute', muted ? '1' : '0');
  } catch (e) {}
}

let state, particles, trail, flash;
function reset(next) {
  if (next) {
    testNo++;
    if (state.passed) level = Math.min(level + 1, LEVELS.length - 1);
    save();
  }
  state = { mode: 'ready', s: 0, v: 0, x: 0, y: 0, vx: 0, vy: 0, th: 0, w: 0, gas: lvl().gas,
            exitSpeed: null, msg: '', reasons: [], score: 0, suction: true, slip: 0, armed: true,
            passed: false, onPad: false, miss: 0, slowUsed: false, slowLeft: 0,
            use: { up: 0, down: 0, left: 0, right: 0, space: 0 } };
  particles = []; trail = []; flash = 0; camX = 0;
  placeOnTrack();
  syncSuctionBtn();
}
function onInput() { if (state.mode === 'ready' && keys.up) state.mode = 'ramp'; }

function placeOnTrack() {
  const p = P[Math.min(P.length - 1, Math.max(0, Math.floor(state.s)))];
  state.x = p.x + p.nx * 11; state.y = p.y + p.ny * 11;
  state.th = Math.atan2(p.nx, -p.ny);
  return p;
}
const norm = a => ((a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;

function leaveTrack(p, why) {
  const c = state;
  c.vx = p.tx * c.v; c.vy = p.ty * c.v;
  c.w = -c.v * p.k;           // carry the turn rate of the curve
  c.exitSpeed = Math.abs(c.v);
  c.mode = 'air'; c.msg = why || ''; c.armed = !keys.up;
}

// ---------- physics ----------
function stepRamp(dt) {
  const c = state, p0 = P[Math.min(P.length - 1, Math.floor(c.s))];
  let a = G * p0.ty - 0.15 * c.v;
  if (keys.up) a += 260;
  if (keys.down && c.v > 0) a -= 320;
  c.v = Math.min(480, c.v + a * dt);
  c.s += c.v * dt;
  if (c.s < 0) { c.s = 0; c.v = Math.max(0, c.v); }
  if (c.s >= P.length - 1) { leaveTrack(P[P.length - 1]); return; }

  const sucking = c.suction && c.gas > 0;
  if (sucking) { c.gas -= 4 * dt; c.use.space += dt; }
  if (keys.up) c.use.up += dt;
  if (keys.down) c.use.down += dt;

  const p = placeOnTrack();
  // normal force: N = v²k − g·n + suction ; walls & ceiling need some grip
  const N = c.v * c.v * p.k - G * p.ny + (sucking ? SUCTION : 0);
  const need = p.ny > -0.5 ? 0.2 * G : 0;
  if (N < need && c.slip === 0) sfx('slip');
  c.slip = N < need ? c.slip + dt : 0;
  if (c.slip > 0.35) leaveTrack(p, 'SIN ADHERENCIA');

  trail.push(tailPos()); if (trail.length > 30) trail.shift();
}

function stepAir(dt) {
  const c = state;
  let ax = lvl().wind, ay = G, al = 0;
  // slow motion only slows the flight (translation); rotation and controls keep normal speed
  const k = c.slowLeft > 0 ? SLOWMO : 1;
  const ux = Math.sin(c.th), uy = -Math.cos(c.th);   // car's "roof" direction
  if (keys.up && c.armed && c.gas > 0) { ax += ux * THRUST; ay += uy * THRUST; c.gas -= 18 * dt * k; c.use.up += dt; emit('main'); }
  if (keys.left && c.gas > 0) { al -= SPIN; c.gas -= 10 * dt; c.use.left += dt; emit('ccw'); }
  if (keys.right && c.gas > 0) { al += SPIN; c.gas -= 10 * dt; c.use.right += dt; emit('cw'); }
  c.gas = Math.max(0, c.gas);
  c.w += al * dt; c.w *= 1 - 0.35 * dt;
  c.vx += ax * dt * k; c.vy += ay * dt * k; c.vx *= 1 - 0.04 * dt * k;
  c.x += c.vx * dt * k; c.y += c.vy * dt * k; c.th += c.w * dt;
  if (c.x < LEFT + 40) { c.x = LEFT + 40; c.vx = Math.abs(c.vx) * 0.4; }
  if (c.x > W - 40) { c.x = W - 40; c.vx = -Math.abs(c.vx) * 0.4; }
  trail.push(tailPos()); if (trail.length > 30) trail.shift();

  // contact with the floor
  const pts = [[-23, 11], [23, 11], [-36, 0], [36, 0], [-12, -15], [12, -15]];
  const cs = Math.cos(c.th), sn = Math.sin(c.th);
  const low = Math.max(...pts.map(([lx, ly]) => c.y + lx * sn + ly * cs));
  if (low >= FLOOR) touchdown();
}

function touchdown() {
  const c = state, ang = Math.abs(norm(c.th)) * 180 / Math.PI;
  c.slowLeft = 0;
  const vy = c.vy / 10, vx = Math.abs(c.vx) / 10, w = Math.abs(c.w);
  const r = [];
  if (ang > 12) r.push(ang > 90 ? 'CAYÓ DE TECHO' : `INCLINADO ${ang.toFixed(0)}°`);
  if (vy > 12) r.push(`IMPACTO ${vy.toFixed(1)} m/s`);
  if (vx > 13) r.push(`DERRAPE ${vx.toFixed(1)} m/s`);
  if (w > 2) r.push('GIRANDO');
  c.reasons = r;
  if (r.length) {
    c.mode = 'crashed'; flash = 1; sfx('crash');
    for (let i = 0; i < 60; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 240;
      particles.push({ x: c.x, y: Math.min(c.y, FLOOR - 4), vx: Math.cos(a) * s + c.vx * 0.3, vy: -Math.abs(Math.sin(a) * s),
                       life: 1.4, max: 1.4, r: 1.5 + Math.random() * 2.5, col: Math.random() < 0.3 ? '255,60,70' : '230,230,235', g: true });
    }
  } else {
    c.mode = 'landed'; sfx('land');
    const L = lvl(), off = Math.abs(c.x - L.pad);
    c.onPad = off <= L.w / 2;
    if (c.onPad) {
      c.score = Math.max(0, Math.round(1000 - ang * 25 - vy * 30 - vx * 15 + c.gas * 3 + (1 - off / (L.w / 2)) * 300));
      c.passed = true;
      unlocked = Math.max(unlocked, Math.min(level + 1, LEVELS.length - 1));
      if (c.score > best) best = c.score;
      save(); sfx('win');
    } else {
      c.miss = (off - L.w / 2) / 10;   // metres from the nearest pad edge
    }
    c.th = 0; c.w = 0; c.y = FLOOR - 11; c.vy = 0;
  }
}

function tailPos() {
  const c = state;
  return { x: c.x + Math.cos(c.th) * -36 - Math.sin(c.th) * -2, y: c.y + Math.sin(c.th) * -36 + Math.cos(c.th) * -2 };
}
function local(lx, ly) {
  const c = state, cs = Math.cos(c.th), sn = Math.sin(c.th);
  return [c.x + lx * cs - ly * sn, c.y + lx * sn + ly * cs];
}
function emit(kind) {
  const c = state, cs = Math.cos(c.th), sn = Math.sin(c.th);
  const spawn = (lx, ly, dx, dy) => {
    const [x, y] = local(lx, ly), s = 140 + Math.random() * 80;
    const wx = dx * cs - dy * sn, wy = dx * sn + dy * cs;
    particles.push({ x, y, vx: c.vx + wx * s + (Math.random() - .5) * 40, vy: c.vy + wy * s + (Math.random() - .5) * 40,
                     life: 0.45, max: 0.45, r: 2 + Math.random() * 2, col: '235,240,255' });
  };
  if (kind === 'main') { spawn(-18, 11, 0, 1); spawn(18, 11, 0, 1); }
  if (kind === 'cw') { spawn(34, -6, 0, -1); spawn(-34, 6, 0, 1); }
  if (kind === 'ccw') { spawn(34, 6, 0, 1); spawn(-34, -6, 0, -1); }
}

function step(dt) {
  const c = state;
  if (c.mode === 'ramp') stepRamp(dt);
  else if (c.mode === 'air') stepAir(dt);
  else if (trail.length) trail.shift();
  for (const p of particles) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 2 * dt; p.vy *= 1 - 2 * dt;
    if (p.g) { p.vy += G * 2 * dt; if (p.y > FLOOR) { p.y = FLOOR; p.vy *= -0.3; } }
    p.r += dt * (p.g ? 0 : 14);
  }
  particles = particles.filter(p => p.life > 0);
  flash = Math.max(0, flash - dt * 2);
  const wnd = lvl().wind;
  if (wnd) for (const s of windStreaks) {
    s.x += wnd * 5 * dt;
    if (s.x > W + 40) s.x -= W + 80; else if (s.x < -40) s.x += W + 80;
  }
  // keep the car at least 150px from the left edge of the screen
  const target = c.mode === 'ready' || c.mode === 'ramp' ? 0 : Math.max(LEFT, Math.min(0, c.x - 150));
  camX += (target - camX) * Math.min(1, dt * 5);
}

// ---------- drawing ----------
function spaced(text, x, y, sp) {
  let w = 0; for (const ch of text) w += ctx.measureText(ch).width + sp; w -= sp;
  let cx = x - w / 2;
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + sp; }
}

function drawBackground() {
  const g = ctx.createRadialGradient(270, 560, 10, 270, 560, 330);
  g.addColorStop(0, 'rgba(60,60,64,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 150, W, 700);
  ctx.fillStyle = '#070708'; ctx.fillRect(LEFT - 400, 460, W - LEFT + 400, FLOOR - 460);  // far horizon band
  for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${s.a})`; ctx.fillRect(s.x, s.y, 1.2, 1.2); }
}

function drawScaffold() {
  ctx.strokeStyle = 'rgba(210,210,215,0.35)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.rect(190, 152, W - 190, 22);
  for (let x = 200; x < W; x += 22) { ctx.moveTo(x, 152); ctx.lineTo(x + 20, 174); }
  for (const x of [438, 456]) { ctx.moveTo(x, 174); ctx.lineTo(x, FLOOR + 30); }
  for (let y = 190; y < FLOOR + 30; y += 46) {
    ctx.moveTo(438, y); ctx.lineTo(W, y);
    ctx.moveTo(438, y); ctx.lineTo(W, y + 46);
  }
  for (let x = 300; x < 438; x += 34) { ctx.moveTo(x, 174); ctx.lineTo(x, 240); }
  ctx.stroke();
}

function drawTrack() {
  ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#2b2b2f'; ctx.lineWidth = 14; ctx.stroke(trackSkirt);
  ctx.strokeStyle = '#7a7a80'; ctx.lineWidth = 28; ctx.stroke(trackBand);
  ctx.save();
  ctx.shadowColor = '#ff2a3a'; ctx.shadowBlur = 10; ctx.strokeStyle = '#ff5a66'; ctx.lineWidth = 2.2;
  ctx.stroke(edgeIn); ctx.stroke(edgeOut);
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 6; ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2;
  ctx.stroke(centerLine);
  ctx.restore();
}

function drawCar(alpha) {
  const c = state;
  if (c.mode === 'crashed') return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(c.x, c.y); ctx.rotate(c.th);
  const g = ctx.createLinearGradient(0, -16, 0, 6);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#85858c');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-36, 3); ctx.lineTo(-36, -4);
  ctx.quadraticCurveTo(-28, -9, -14, -13); ctx.quadraticCurveTo(0, -17, 12, -13);
  ctx.quadraticCurveTo(28, -7, 36, -2); ctx.lineTo(36, 3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1b1b20';
  ctx.beginPath(); ctx.moveTo(-18, -10); ctx.quadraticCurveTo(-2, -15.5, 12, -11.5);
  ctx.quadraticCurveTo(18, -9.5, 20, -8.5); ctx.lineTo(-20, -8.5); ctx.closePath(); ctx.fill();
  for (const wx of [-23, 23]) {
    ctx.fillStyle = '#0d0d0f'; ctx.beginPath(); ctx.arc(wx, 4, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#b8b8be'; ctx.beginPath(); ctx.arc(wx, 4, 3, 0, 7); ctx.fill();
  }
  ctx.shadowBlur = 12;
  ctx.shadowColor = '#ff2030'; ctx.fillStyle = '#ff3a48'; ctx.fillRect(-37, -4, 3, 4);
  ctx.shadowColor = '#ffffff'; ctx.fillStyle = '#ffffff'; ctx.fillRect(34, -3, 3, 3);
  ctx.restore();
}

function drawTrail(alpha) {
  if (trail.length < 2) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = 1; i < trail.length; i++) {
    ctx.strokeStyle = `rgba(255,50,60,${i / trail.length * 0.8})`;
    ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
  }
  ctx.restore();
}

function drawParticles(alpha) {
  for (const p of particles) {
    ctx.fillStyle = `rgba(${p.col},${(p.life / p.max) * (p.g ? 1 : 0.5) * alpha})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
}

function drawWorld(alpha) {
  drawTrack(); drawTrail(alpha); drawParticles(alpha); drawCar(alpha);
}

function drawReflection() {
  ctx.save();
  ctx.beginPath(); ctx.rect(LEFT - 400, FLOOR + 2, W - LEFT + 400, 150); ctx.clip();
  ctx.translate(0, 2 * FLOOR); ctx.scale(1, -1); ctx.globalAlpha = 0.16;
  drawWorld(1);
  ctx.restore();
  const g = ctx.createLinearGradient(0, FLOOR, 0, FLOOR + 150);
  g.addColorStop(0, 'rgba(0,0,0,0.2)'); g.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = g; ctx.fillRect(LEFT - 400, FLOOR + 2, W - LEFT + 400, 150);
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(LEFT - 400, FLOOR, W - LEFT + 400, 1);
}

function drawPad() {
  const L = lvl(), x0 = L.pad - L.w / 2, x1 = L.pad + L.w / 2;
  const g = ctx.createLinearGradient(0, FLOOR - 60, 0, FLOOR);
  g.addColorStop(0, 'rgba(91,227,138,0)'); g.addColorStop(1, 'rgba(91,227,138,0.13)');
  ctx.fillStyle = g; ctx.fillRect(x0, FLOOR - 60, L.w, 60);
  ctx.save(); ctx.shadowColor = '#5be38a'; ctx.shadowBlur = 10; ctx.fillStyle = '#5be38a';
  ctx.fillRect(x0, FLOOR - 2, L.w, 3);
  ctx.fillRect(x0 - 1, FLOOR - 14, 2, 14); ctx.fillRect(x1 - 1, FLOOR - 14, 2, 14);
  ctx.restore();
  ctx.fillStyle = 'rgba(91,227,138,0.85)'; ctx.font = '500 8px Orbitron, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('ZONA DE ATERRIZAJE', L.pad, FLOOR - 18);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
}

// ballistic path with no thrusters: from the car in the air, or from the ramp exit at the current speed
function predictPath() {
  const c = state, L = lvl();
  let x, y, vx, vy;
  if (c.mode === 'air') { x = c.x; y = c.y; vx = c.vx; vy = c.vy; }
  else if (c.mode === 'ramp' && c.s > P.length - 320) {
    const e = P[P.length - 1]; x = e.x + e.nx * 11; y = e.y + e.ny * 11; vx = e.tx * c.v; vy = e.ty * c.v;
  } else return null;
  const pts = [[x, y]], dt = 1 / 40;
  for (let i = 0; i < 320 && y < FLOOR - 11; i++) {
    vx += L.wind * dt; vy += G * dt; vx *= 1 - 0.04 * dt;
    x += vx * dt; y += vy * dt;
    if (x < LEFT + 40) { x = LEFT + 40; vx = Math.abs(vx) * 0.4; }
    pts.push([x, y]);
  }
  return pts;
}
function drawPrediction() {
  const pts = predictPath(); if (!pts) return;
  const L = lvl(), ex = pts[pts.length - 1][0];
  const col = Math.abs(ex - L.pad) <= L.w / 2 ? '91,227,138' : '255,90,102';
  ctx.save(); ctx.setLineDash([3, 6]); ctx.lineWidth = 1.5; ctx.strokeStyle = `rgba(${col},0.55)`;
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  ctx.setLineDash([]); ctx.strokeStyle = `rgba(${col},0.95)`; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(ex - 6, FLOOR - 6); ctx.lineTo(ex + 6, FLOOR + 6); ctx.moveTo(ex + 6, FLOOR - 6); ctx.lineTo(ex - 6, FLOOR + 6);
  ctx.stroke(); ctx.restore();
}

function drawWind() {
  const wnd = lvl().wind; if (!wnd) return;
  ctx.strokeStyle = 'rgba(200,210,230,0.16)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (const s of windStreaks) { ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - Math.sign(wnd) * s.len, s.y); }
  ctx.stroke();
}

function drawGround() {
  // distance marks every 10 m from the ramp exit, plus the far barrier
  ctx.font = '500 8px Orbitron, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let m = 10; 190 - m * 10 > LEFT + 20; m += 10) {
    const x = 190 - m * 10;
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(x, FLOOR, 1, 6);
    ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillText(`${m} m`, x, FLOOR + 9);
  }
  ctx.strokeStyle = 'rgba(255,90,102,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let y = 300; y < FLOOR; y += 40) { ctx.moveTo(LEFT, y); ctx.lineTo(LEFT + 14, y + 20); ctx.moveTo(LEFT + 14, y + 20); ctx.lineTo(LEFT, y + 40); }
  ctx.moveTo(LEFT, 300); ctx.lineTo(LEFT, FLOOR); ctx.moveTo(LEFT + 14, 300); ctx.lineTo(LEFT + 14, FLOOR);
  ctx.stroke();
  ctx.textAlign = 'left';
}

function drawHeader() {
  const c = state;
  ctx.textBaseline = 'middle'; ctx.fillStyle = '#f2f2f2';
  ctx.font = '700 15px Orbitron, monospace';
  const head = c.mode === 'crashed' ? 'NOBODY SAW THE FAILURES.'
             : c.mode === 'landed' && !c.onPad ? 'SO CLOSE.' : 'EVERYONE SAW THE SUCCESS.';
  spaced(head, W / 2, 62, 3.5);
  ctx.font = '500 11px Orbitron, monospace'; ctx.fillStyle = '#bbb';
  const n = String(testNo).padStart(2, '0');
  ctx.textAlign = 'right'; spaced('TEST', W / 2 - 4, 108, 4);
  ctx.textAlign = 'left'; ctx.font = '700 22px Orbitron, monospace'; ctx.fillStyle = '#fff';
  ctx.fillText(n, W / 2 + 22, 107);
  const L = lvl(), wnd = L.wind / 10;
  ctx.font = '500 8.5px Orbitron, monospace'; ctx.fillStyle = '#7d7d84'; ctx.textAlign = 'center';
  ctx.fillText(`NIVEL ${level + 1}/${LEVELS.length}  ·  ZONA A ${Math.round((EXIT_X - L.pad) / 10)} m  ·  ` +
               (wnd ? `VIENTO ${wnd > 0 ? '→' : '←'} ${Math.abs(wnd).toFixed(1)} m/s²` : 'SIN VIENTO'), W / 2, 132);
  ctx.textAlign = 'right'; ctx.fillStyle = muted ? '#55555b' : '#9a9aa0';
  ctx.fillText(muted ? 'SONIDO OFF' : 'SONIDO ON', W - 12, 20);
  ctx.textAlign = 'left';
}

function bar(x, y, w, frac, col) {
  ctx.fillStyle = '#1c1c20'; ctx.fillRect(x, y, w, 5);
  ctx.fillStyle = col; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), 5);
}

function drawHUD() {
  const c = state, air = c.mode === 'air' || c.mode === 'landed' || c.mode === 'crashed';
  const ang = Math.abs(norm(c.th)) * 180 / Math.PI;
  const vy = c.vy / 10, vx = Math.abs(c.vx) / 10;
  const ok = '#5be38a', bad = '#ff4a58', dim = '#8a8a90';
  ctx.font = '500 9px Orbitron, monospace'; ctx.textBaseline = 'middle';

  // telemetry (left column)
  const rows = c.mode === 'ramp' || c.mode === 'ready'
    ? [['GAS FRÍO', `${c.gas.toFixed(0)}%`, c.gas / 100, c.gas > 30 ? '#ddd' : bad],
       ['VELOCIDAD', `${(c.v / 10).toFixed(1)} m/s`, c.v / 480, '#ddd'],
       ['ZONA', `${Math.round((EXIT_X - lvl().pad) / 10)} m`, 0, '#5be38a'],
       ['SUCCIÓN', c.suction && c.gas > 0 ? 'ON' : 'OFF', c.suction ? 1 : 0, c.suction ? '#ff5a66' : dim]]
    : [['GAS FRÍO', `${c.gas.toFixed(0)}%`, c.gas / 100, c.gas > 30 ? '#ddd' : bad],
       ['ÁNGULO', `${ang.toFixed(0)}°`, 1 - ang / 180, ang <= 12 ? ok : bad],
       ['V. VERTICAL', `${vy.toFixed(1)} m/s`, 1 - Math.max(0, vy) / 40, vy <= 12 ? ok : bad],
       ['V. HORIZONTAL', `${vx.toFixed(1)} m/s`, 1 - vx / 40, vx <= 13 ? ok : bad]];
  rows.forEach(([label, val, f, col], i) => {
    const y = 852 + i * 26;
    ctx.fillStyle = dim; ctx.textAlign = 'left'; ctx.fillText(label, 20, y);
    ctx.fillStyle = col; ctx.textAlign = 'right'; ctx.fillText(val, 180, y);
    bar(20, y + 8, 160, f, col);
  });

  // thruster usage (middle column)
  const use = [['▲', air ? 'PROPULSOR' : 'ACELERAR', 'up'], ['◀', 'GIRO IZQ', 'left'], ['▶', 'GIRO DER', 'right'], ['␣', 'SUCCIÓN', 'space']];
  use.forEach(([sym, label, k], i) => {
    const y = 852 + i * 26, t = c.use[k], on = k === 'space' ? c.suction && c.mode === 'ramp' : keys[k];
    ctx.fillStyle = on ? '#ff3a48' : '#333'; ctx.beginPath(); ctx.arc(204, y, 3.5, 0, 7); ctx.fill();
    ctx.fillStyle = dim; ctx.textAlign = 'left'; ctx.fillText(`${sym} ${label}`, 214, y);
    ctx.fillStyle = t > 0 ? '#ddd' : '#555'; ctx.textAlign = 'right'; ctx.fillText(`${t.toFixed(1)}s`, 336, y);
    bar(214, y + 8, 122, t / 3, on ? '#ff5a66' : '#77777d');
  });

  // attitude dial (right)
  const cx = 398, cy = 890, R = 38;
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
  ctx.strokeStyle = ok; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2 - 0.21, -Math.PI / 2 + 0.21); ctx.stroke();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(c.th);
  ctx.strokeStyle = ang <= 12 ? ok : '#ddd'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -R + 6); ctx.stroke();      // roof direction
  ctx.fillStyle = '#ddd'; ctx.fillRect(-16, -2, 32, 5);
  ctx.fillStyle = '#ff3a48'; ctx.fillRect(-17, -2, 3, 3);
  ctx.restore();
  ctx.fillStyle = dim; ctx.textAlign = 'center'; ctx.fillText('ACTITUD', cx, cy + R + 12);

  ctx.fillStyle = '#5a5a60'; ctx.font = '500 8.5px Orbitron, monospace';
  ctx.fillText(isTouch ? 'RAMPA: ▲ ACELERA · ▼ FRENA · SUCCIÓN' : 'RAMPA: ↑ ACELERA · ↓ FRENA · ESPACIO SUCCIÓN ON/OFF', W / 2, 958);
  ctx.fillText(isTouch ? 'AIRE: ▲ PROPULSOR · ⟲ ⟳ GIRO · LENTO (NIV. 1-3)' : 'AIRE: ↑ PROPULSOR · ← → GIRO · ESPACIO CÁMARA LENTA (NIV. 1-3)', W / 2, 972);
  ctx.fillText(isTouch ? 'REINICIAR: TOCÁ LA PANTALLA' : 'ESPACIO / R REINICIAR · M SONIDO · 1-7 NIVEL', W / 2, 986);
  ctx.textAlign = 'left';
}

function panel(lines, y0) {
  const h = lines.length * 22 + 26;
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(24, y0, 270, h); ctx.strokeRect(24.5, y0 + 0.5, 270, h);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach(([t, font, col], i) => { ctx.font = font; ctx.fillStyle = col; ctx.fillText(t, 40, y0 + 24 + i * 22); });
}

function drawOverlay() {
  const c = state, B = '700 13px Orbitron, monospace', S = '500 9.5px Orbitron, monospace';
  if (c.mode === 'ready') {
    const L = lvl();
    panel([[`NIVEL ${level + 1}: ZONA A ${Math.round((EXIT_X - L.pad) / 10)} m`, B, '#5be38a'],
           ['1. Subí la rampa (↑). La SUCCIÓN arranca', S, '#bbb'],
           ['   prendida (espacio la prende/apaga).', S, '#bbb'],
           ['2. Salís boca abajo: girá con ← →', S, '#bbb'],
           ['3. Frená la caída con ↑ (empuja', S, '#bbb'],
           ['   hacia donde apunta el techo).', S, '#bbb'],
           ['4. Aterrizá con las 4 ruedas:', S, '#bbb'],
           ['   < 12°, < 12 m/s, dentro de la ZONA.', S, '#bbb'],
           ['La línea punteada muestra dónde caés.', S, '#bbb'],
           ...(level < EASY_LEVELS ? [[`AYUDA: ${isTouch ? 'LENTO' : 'ESPACIO'} en el aire = cámara lenta 5 s`, S, '#7fb8ff']] : []),
           ['PRESIONÁ ↑ PARA ARRANCAR', B, '#ff5a66']], 300);
  } else if (c.mode === 'landed' && !c.onPad) {
    const short = c.x > lvl().pad;   // the car flies left, so landing right of the pad means it fell short
    panel([['AUTO INTACTO, FUERA DE ZONA', B, '#ffb347'],
           [`${short ? 'Te quedaste corto' : 'Te pasaste'} por ${c.miss.toFixed(1)} m`, S, '#ddd'],
           [short ? 'Salí más rápido de la rampa.' : 'Salí más lento o frená en el aire.', S, '#bbb'],
           [isTouch ? 'TOCÁ PARA REINTENTAR' : 'ESPACIO: REINTENTAR', B, '#ff5a66']], 320);
  } else if (c.mode === 'landed') {
    const last = level === LEVELS.length - 1;
    panel([['ATERRIZAJE EN LA ZONA', B, '#5be38a'],
           [`PUNTAJE  ${c.score}`, B, '#fff'],
           [`MEJOR    ${best}`, S, '#bbb'],
           [`Salida de rampa: ${(c.exitSpeed / 10).toFixed(1)} m/s`, S, '#bbb'],
           [`Gas restante: ${c.gas.toFixed(0)}%`, S, '#bbb'],
           [last ? '¡SUPERASTE LOS 7 NIVELES!' : `Desbloqueaste el NIVEL ${level + 2}`, S, '#5be38a'],
           [isTouch ? 'TOCÁ PARA SEGUIR' : 'ESPACIO: SEGUIR', B, '#ff5a66']], 320);
  } else if (c.mode === 'crashed') {
    panel([['IMPACTO — AUTO DESTRUIDO', B, '#ff4a58'],
           ...c.reasons.map(r => ['· ' + r, S, '#ddd']),
           ...(c.msg ? [['· Se despegó: ' + c.msg, S, '#ddd']] : []),
           [isTouch ? 'TOCÁ PARA REINTENTAR' : 'ESPACIO: REINTENTAR', B, '#ff5a66']], 320);
  } else if (c.mode === 'ramp' && (c.slip > 0 || (!c.suction && c.s > 180))) {
    ctx.font = '700 11px Orbitron, monospace'; ctx.fillStyle = '#ff5a66'; ctx.textAlign = 'center';
    ctx.fillText(c.slip > 0 ? '¡SE DESPEGA! PRENDÉ LA SUCCIÓN' : 'SUCCIÓN APAGADA', W / 2, 156); ctx.textAlign = 'left';
  } else if (c.mode === 'air' && !c.armed && keys.up) {
    ctx.font = '700 11px Orbitron, monospace'; ctx.fillStyle = '#ddd'; ctx.textAlign = 'center';
    ctx.fillText('SOLTÁ ↑ Y VOLVÉ A APRETAR PARA EL PROPULSOR', W / 2, 156); ctx.textAlign = 'left';
  }
  if (c.slowLeft > 0) {
    ctx.fillStyle = 'rgba(80,140,255,0.07)'; ctx.fillRect(0, 0, W, H);
    ctx.font = '700 11px Orbitron, monospace'; ctx.fillStyle = '#7fb8ff'; ctx.textAlign = 'center';
    ctx.fillText(`CÁMARA LENTA  ${c.slowLeft.toFixed(1)} s`, W / 2, 178);
    ctx.fillStyle = '#1c2230'; ctx.fillRect(W / 2 - 70, 188, 140, 3);
    ctx.fillStyle = '#7fb8ff'; ctx.fillRect(W / 2 - 70, 188, 140 * c.slowLeft / SLOW_TIME, 3);
    ctx.textAlign = 'left';
  } else if (canSlow()) {
    ctx.font = '500 9.5px Orbitron, monospace'; ctx.fillStyle = 'rgba(127,184,255,0.85)'; ctx.textAlign = 'center';
    ctx.fillText(`${isTouch ? 'LENTO' : 'ESPACIO'}: CÁMARA LENTA 5 s`, W / 2, 178); ctx.textAlign = 'left';
  }
  if (c.mode === 'air' && c.msg && !(!c.armed && keys.up)) {
    ctx.font = '700 11px Orbitron, monospace'; ctx.fillStyle = '#ff5a66'; ctx.textAlign = 'center';
    ctx.fillText(c.msg, W / 2, 156); ctx.textAlign = 'left';
  }
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(-camX, 0);
  drawBackground();
  drawScaffold();
  drawReflection();
  drawGround();
  drawPad();
  drawPrediction();
  drawWorld(1);
  ctx.restore();
  drawWind();
  // landing zone off screen
  const padSX = lvl().pad - camX;
  if (padSX + lvl().w / 2 < 0 && state.mode !== 'crashed') {
    ctx.fillStyle = 'rgba(91,227,138,0.8)'; ctx.font = '500 9px Orbitron, monospace'; ctx.textAlign = 'left';
    ctx.fillText(`◀ ZONA ${Math.max(0, Math.round((state.x - lvl().pad) / 10))} m`, 12, FLOOR - 14);
  }
  // arrow toward the ramp when it is off screen
  if (camX < -W) {
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '500 9px Orbitron, monospace'; ctx.textAlign = 'right';
    ctx.fillText(`RAMPA ${Math.round((190 - state.x) / 10)} m ▶`, W - 12, FLOOR - 14); ctx.textAlign = 'left';
  }
  if (flash) { ctx.fillStyle = `rgba(255,40,50,${flash * 0.25})`; ctx.fillRect(0, 0, W, H); }
  drawHeader();
  drawHUD();
  drawOverlay();
}

// ---------- loop ----------
reset(false);
let last = performance.now(), acc = 0;
const DT = 1 / 120;
function frame(t) {
  const real = Math.min(0.1, (t - last) / 1000); last = t;
  if (state.slowLeft > 0) state.slowLeft = Math.max(0, state.slowLeft - real);
  acc += real;
  while (acc >= DT) { step(DT); acc -= DT; }
  draw();
  updateAudio();
  syncSuctionBtn();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
